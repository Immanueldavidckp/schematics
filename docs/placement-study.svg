roke="#333" stroke-width="1.2"/><text x="450.0" y="200.0" font-size="8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">U9 LDO</text><rect x="490" y="185.0" width="90" height="50" fill="#fff3bf" stroke="#333" stroke-width="1.2"/><text x="535.0" y="205.0" font-size="8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">J2 battery</text><text x="535.0" y="217.0" font-size="6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" fill="#444">JST-XH</text><rect x="540" y="220" width="310" height="280" fill="#cfe2ff" stroke="#333" stroke-width="1.2"/><text x="695.0" y="355.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">U1 EC200U-CN</text><text x="695.0" y="367.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" fill="#444">31 x 28, ANT edge -></text><rect x="540" y="520" width="150" height="120" fill="#cfe2ff" stroke="#333" stroke-width="1.2"/><text x="615.0" y="575.0" font-size="8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">X1 nano-SIM</text><text x="615.0" y="587.0" font-size="6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" fill="#444">+ X2 MFF2 pads</text><rect x="710" y="530" width="90" height="60" fill="#cfe2ff" stroke="#333" stroke-width="1.2"/><text x="755.0" y="560.0" font-size="7" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">USB TPs</text><circle cx="820" cy="105.0" r="22.0" fill="#b8d4ff" stroke="#333" stroke-width="1.2"/><text x="820" y="108.0" font-size="8" text-anchor="middle" font-family="sans-serif">AF2</text><circle cx="820" cy="615.0" r="22.0" fill="#b8d4ff" stroke="#333" stroke-width="1.2"/><text x="820" y="618.0" font-size="8" text-anchor="middle" font-family="sans-serif">AF1</text><text x="760" y="80.0" font-size="9" font-family="sans-serif" fill="#036">GNSS U.FL</text><text x="760" y="654.0" font-size="9" font-family="sans-serif" fill="#036">LTE U.FL</text><line x1="820" y1="130" x2="820" y2="590" stroke="#036" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/><text x="830" y="360" font-size="10" font-family="sans-serif" fill="#036" transform="rotate(90 830 360)">51 mm  (spec &#8805;15 mm)</text><line x1="850" y1="299.0" x2="820" y2="140" stroke="#06c" stroke-width="2"/><line x1="850" y1="356.0" x2="820" y2="580" stroke="#06c" stroke-width="2"/><text x="720" y="175.0" font-size="8" font-family="sans-serif" fill="#06c">50R CPWG, pi at pads</text><text x="60" y="30" font-size="16" font-family="sans-serif" font-weight="bold">Placement study - MEWP telematics tracker (MILESTONE 4 PREP)</text><text x="60" y="48" font-size="11" font-family="sans-serif" fill="#a00">OUTLINE 80 x 60 mm PROVISIONAL - final outline + M3 hole positions come from the purchased housing. Not for routing.</text><text x="60" y="684" font-size="10.5" font-family="sans-serif">Stackup (JLC standard 1.6 mm, JLC7628): L1 = signal + RF (50R CPWG for ANT traces) | L2 = solid GND (no splits) | L3 = power pours (5V0 / SYS / 3V3, VIN routed thick) | L4 = signal / slow.</text><text x="60" y="699" font-size="10.5" font-family="sans-serif">EC200U oriented ANT pads (47/49) toward the right edge: ANT_MAIN -> AF1 (LTE, bottom-right), ANT_GNSS -> AF2 (GNSS, top-right); keep both runs short, GND-fenced, no L2 interruptions.</text><text x="60" y="714" font-size="10.5" font-family="sans-serif">Battery (103450) lives in the housing beside/above the board - pocket is an enclosure feature; board provides J2 at the centre-bottom edge. FPC LTE antenna + GNSS patch mount in the lid;</text><text x="60" y="729" font-size="10.5" font-family="sans-serif">GND keepout under the FPC antenna region per antenna datasheet (applies to the lid-facing area near the right edge). Silk 'HV ZONE' boundary at x = 20 with 1.5 mm clearance rule (handoff 7).</text><text x="60" y="744" font-size="10.5" font-family="sans-serif">VBAT_MODEM caps (2x100uF+1uF+100nF+SMF5.0A) inside 5 mm of U1 pads 57-60 (bottom edge of module as placed). U8 TXB sits between MCU and module left edge. SIM group beside module, away from RF edge.</text></svg>